<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Creator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <h1 class="logo"><a href="dashboard.html">Scouties</a></h1>
        </nav>
        <div class="txtArea">
            <h2> Welcome onboard !</h2>
            <p>Having an account allows you to create games, earn passive income and even more!</p>
        </div>
        <form id="authForm">
            <div id="emailSection">
                <label for="email">Tell us your email in order to sign up or log in:</label>
                <input type="email" placeholder="example@gmail.com" id="email" required>
                <button type="button" id="continueBtn">Continue with email</button>
            </div>

            <!--Disable by default-->
            <div id="pwdSection" style="display: none;">
                <label for="pwd">Your password</label>
                <input type="password" id="pwd" required>
                <button type="submit" id="loginBtn">Log in</button>
                <span>forget your password?</span>
            </div>
        </form>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
