<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Checkpoint – Scouties</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/location.css">
</head>
<body>

<!-- Top nav -->
<header class="loc-header">
    <div class="loc-header-left">
        <a id="backToRoute" href="#" class="loc-nav-link">
            <i class="fa-solid fa-chevron-left"></i> Complete route
        </a>
        <div class="loc-tabs" id="locTabs"></div>
    </div>
    <a href="#" class="loc-preview-btn">
        <i class="fa-solid fa-mobile-screen"></i> Preview game
    </a>
</header>

<!-- Main layout: editor left, phone right -->
<div class="loc-layout">

    <!-- ── LEFT: editor ── -->
    <div class="loc-editor-col" id="locEditor">
        <!-- populated by edit.js -->
    </div>

    <!-- ── RIGHT: phone mockup ── -->
    <div class="loc-phone-col">
        <div class="phone-frame">
            <div class="phone-status-bar">
                <span>9:41</span>
                <div class="phone-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>
            <div class="phone-stats-bar">
                <span class="ph-stat ph-stat-loc"><i class="fa-solid fa-location-dot"></i> 1/10</span>
                <span class="ph-stat ph-stat-xp"><i class="fa-solid fa-star"></i> 0-10</span>
                <span class="ph-stat ph-stat-pts"><i class="fa-solid fa-bolt"></i> 3100</span>
            </div>
            <div class="phone-content" id="phoneContent">
                <div class="ph-placeholder">
                    <i class="fa-solid fa-eye"></i>
                    <p>Preview appears here as you edit</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="js/db.js"></script>
<script src="js/escape-html.js"></script>
<script src="js/media-editor.js"></script>
<script src="js/edit.js"></script>
</body>
</html>
