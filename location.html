<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

  <h1 class="mb-4">Edit Location</h1>

  <form id="editForm" class="mb-5">
    <div class="mb-3">
      <label class="form-label" for="direction">Directions</label>
      <textarea id="direction" class="form-control" name="direction"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label" for="challenge">Challenge</label>
      <textarea id="challenge" class="form-control" name="challenge"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label" for="answer">Answer</label>
      <textarea id="answer" class="form-control" name="answer"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label" for="hint">Hint</label>
      <textarea id="hint" class="form-control" name="hint"></textarea>
    </div>
    
    <div class="mb-3">
        <label for="etc" class="form-label">ETC (Estimated time of completion)</label>
        <input type="number" id="etc" class="form-control" placeholder="minutes" name="etc"/>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>

  <script src="/js/edit.js"></script>
</body>
</html>
